<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - SiteStream</title>
  <meta name="description" content="Your invoice payment has been received successfully.">
  <meta name="robots" content="noindex, nofollow">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#14B8A6',
            'primary-dark': '#0D9488',
            'primary-light': '#5EEAD4',
          }
        }
      }
    }
  </script>
  <link rel="icon" type="image/png" href="images/logo.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    html { scrollbar-gutter: stable; }
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col">
  
  <!-- Navigation -->
  <nav class="fixed w-full z-50 bg-white/80 backdrop-blur-lg border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="images/logo.png" alt="SiteStream" class="h-10 w-10 cursor-pointer" onclick="window.location='index.html'">
        <span class="text-xl font-bold text-gray-900 cursor-pointer" onclick="window.location='index.html'">SiteStream</span>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <main class="flex-1 flex items-center justify-center pt-20 px-6">
    <div class="text-center max-w-md">
      <!-- Checkmark Icon -->
      <div class="mx-auto w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mb-6">
        <svg class="w-10 h-10 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      
      <h1 class="text-3xl font-bold text-gray-900 mb-4">Payment Successful!</h1>
      <p class="text-gray-600 text-lg mb-6">
        Your payment for invoice <span id="invoice-number" class="font-semibold text-gray-900"></span> has been received. The sender will be notified automatically.
      </p>
      
      <p id="redirect-notice" class="text-primary font-semibold text-sm mb-4" style="display: none;">Returning to SiteStream in <span id="countdown">3</span>s...</p>
      
      <!-- Deep link back to app -->
      <a id="back-to-app" href="#" class="inline-flex items-center gap-2 bg-primary hover:bg-primary-dark text-white px-6 py-3 rounded-full font-semibold transition mb-4" style="display: none;">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Return to SiteStream
      </a>
      
      <p id="close-text" class="text-gray-400 text-sm" style="display: none;">Or close this page to continue.</p>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const invoiceDisplay = params.get('invoice');
    const invoiceId = params.get('id');
    const el = document.getElementById('invoice-number');
    const backBtn = document.getElementById('back-to-app');
    
    if (invoiceDisplay) {
      el.textContent = invoiceDisplay;
    } else {
      el.parentElement.innerHTML = 'Your payment has been received. The sender will be notified automatically.';
    }
    
    // Deep link back to the app
    const redirectNotice = document.getElementById('redirect-notice');
    const countdownEl = document.getElementById('countdown');
    const closeText = document.getElementById('close-text');
    
    function showReturnLink(deepLink) {
      backBtn.href = deepLink;
      backBtn.style.display = 'inline-flex';
      redirectNotice.style.display = 'block';
      closeText.style.display = 'block';
      
      let seconds = 3;
      const timer = setInterval(() => {
        seconds--;
        countdownEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(timer);
          redirectNotice.textContent = 'Redirecting...';
          window.location.href = deepLink;
        }
      }, 1000);
    }
    
    if (invoiceId) {
      showReturnLink('sitestream://invoice/' + invoiceId + '?paid=true');
    } else {
      // No invoice ID in params (e.g. Apple Pay flow) — still show return to app
      showReturnLink('sitestream://invoices?paid=true');
    }
  </script>
</body>
</html>
